# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: arpit-portfolio
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: ADMIN_TOKEN
        generateValue: true # used to read contact messages at /api/admin/messages
